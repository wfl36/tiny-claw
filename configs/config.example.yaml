provider:
  # type: 目前仅支持 "openai" (走 OpenAI 兼容 API,可对接任意兼容端点)
  type: openai

  # 兼容端点 base url, 几个常见样例:
  #   OpenAI 官方   : https://api.openai.com/v1
  #   DeepSeek      : https://api.deepseek.com/v1
  #   通义千问      : https://dashscope.aliyuncs.com/compatible-mode/v1
  #   智谱 GLM      : https://open.bigmodel.cn/api/paas/v4
  base_url: https://api.openai.com/v1

  api_key: sk-REPLACE-ME

  # 模型名,由 base_url 对应的厂商决定
  model: gpt-4o-mini

  # 单次请求超时,留空默认 60s
  timeout: 60s

# 飞书机器人配置 (仅 -feishu 模式需要)
# 在飞书开放平台 → 凭证与基础信息 中获取 app_id / app_secret
# 长连接模式无需 verify_token / encrypt_key (留空即可)
feishu:
  app_id: cli_REPLACE-ME
  app_secret: REPLACE-ME
  verify_token: ""
  encrypt_key: ""
